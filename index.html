    <h1>품질평가 업무캘린더</h1>
    <p>주택관리 품질평가 업무를 달력으로 관리하고, 증빙 사진을 모아 한글(.hwpx) 보고서를 만드는 Windows 프로그램입니다.</p>
    <p>같은 관리소의 여러 PC가 관리소 공용 구글 계정으로 연결하면, 각 PC에서 입력한 업무 기록·증빙 사진·기본정보·점검표가 서로 합쳐집니다. 이때 프로그램은 구글 드라이브의 '앱 전용 숨은 공간'만 사용하며, 다른 드라이브 파일에는 접근하지 않습니다.</p>
